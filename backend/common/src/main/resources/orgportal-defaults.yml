# Shared defaults for every module (lowest precedence; a service's application.yml can override).
# Loaded by OrgPortalDefaultsEnvironmentPostProcessor.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 3
      # Keep one warm connection per service (8 in total, fine for Supabase's transaction pooler);
      # extra connections close after 30 s idle. Opening a new one to Supabase can take several seconds.
      minimum-idle: 1
      idle-timeout: 30000
      connection-timeout: 20000
  jpa:
    open-in-view: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        # Lets services start before the Supabase tables exist (or while the DB is unreachable).
        boot.allow_jdbc_metadata_access: false
        jdbc.time_zone: UTC
  data:
    web:
      pageable:
        max-page-size: 100
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

orgportal:
  time-zone: ${ORG_TIME_ZONE:America/Chicago}
  security:
    jwt-secret: ${JWT_SECRET}
    jwt-expiry: 2h
    internal-token: ${INTERNAL_SERVICE_TOKEN}
  services:
    user-url: ${USER_SERVICE_URL:http://localhost:8081}
    event-url: ${EVENT_SERVICE_URL:http://localhost:8082}
    task-url: ${TASK_SERVICE_URL:http://localhost:8083}
    content-url: ${CONTENT_SERVICE_URL:http://localhost:8084}
    notification-url: ${NOTIFICATION_SERVICE_URL:http://localhost:8085}
    reporting-url: ${REPORTING_SERVICE_URL:http://localhost:8086}
    ai-url: ${AI_SERVICE_URL:http://localhost:8087}
  openapi:
    server-url: ${GATEWAY_API_URL:http://localhost:8080/api}

springdoc:
  # Readable /v3/api-docs output (exported to docs/api/ by export-openapi.sh).
  writer-with-default-pretty-printer: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-components: always

logging:
  pattern:
    level: "%5p [%X{requestId:-}]"
