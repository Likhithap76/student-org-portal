# Defaults for the "test" profile: in-memory H2 in PostgreSQL mode. Tests never connect to Supabase.
spring:
  datasource:
    url: jdbc:h2:mem:test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        boot.allow_jdbc_metadata_access: true

orgportal:
  security:
    jwt-secret: test-only-jwt-secret-at-least-32-bytes-long
    internal-token: test-internal-token
