# Shared settings (datasource, JPA, JWT, actuator, logging) come from common's orgportal-defaults.yml.
server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: user-service
  profiles:
    # "local" = shared file-based H2 until Supabase is ready. Use SPRING_PROFILES_ACTIVE=supabase for Supabase.
    default: local

orgportal:
  security:
    public-paths:
      - /auth/register
      - /auth/login
  seed-admin:
    enabled: true
    email: ${SEED_ADMIN_EMAIL:}
    password: ${SEED_ADMIN_PASSWORD:}
    display-name: ${SEED_ADMIN_NAME:Administrator}
